name: Andhra catchup

on:
  schedule:
    - cron: '0 5,11,17,23 * * *' # Every six hours; 04:30, 10:30, 16:30, 22:30 IST.
  workflow_dispatch:
    inputs:
      from_date:
        description: Start date (DD-MM-YYYY); blank resumes saved progress
        type: string
        default: ''
      to_date:
        description: End date (DD-MM-YYYY); blank uses today
        type: string
        default: ''
      run_time_mins:
        description: Total catch-up work budget in minutes (1–210); job limit is 4 hours
        type: string
        default: '210'

permissions:
  contents: read

jobs:
  catchup:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-archive.yml
    with:
      mode: catchup
      source: andhra_goir
      from_date: ${{ inputs.from_date }}
      to_date: ${{ inputs.to_date }}
      run_time_mins: ${{ inputs.run_time_mins || '210' }}
    secrets: inherit
