name: Backfill Andhra orders

on:
  schedule:
    - cron: '0 5,11,17,23 * * *' # Every six hours; 04:30, 10:30, 16:30, 22:30 IST.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    name: Historical gaps
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-andhra.yml
    with:
      partition: all
    secrets: inherit
