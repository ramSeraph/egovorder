name: Catch up government orders

on:
  schedule:
    - cron: '0 5,11,17,23 * * *' # Every six hours; 04:30, 10:30, 16:30, 22:30 IST.
  workflow_dispatch:
    inputs:
      source:
        description: Source to catch up
        type: choice
        options: [all, andhra_goir, telangana_goir, uttarakhand_gos]
        default: all
      from_date:
        description: Start date (DD-MM-YYYY); blank dates resume Andhra/Uttarakhand from IA, Telangana from its earliest date
        type: string
        default: ''
      to_date:
        description: End date (DD-MM-YYYY); blank uses today
        type: string
        default: ''
      run_time_mins:
        description: Total catch-up work budget in minutes (1–210); job limit is 4 hours
        type: string
        default: '210'

permissions:
  contents: read

jobs:
  andhra:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       ((inputs.source == 'all' || inputs.source == 'andhra_goir') &&
        inputs.from_date == '' && inputs.to_date == ''))
    uses: ./.github/workflows/run-andhra.yml
    with:
      partition: latest
      run_time_mins: ${{ inputs.run_time_mins || '210' }}
    secrets: inherit

  andhra_dates:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      (inputs.source == 'all' || inputs.source == 'andhra_goir') &&
      (inputs.from_date != '' || inputs.to_date != '')
    uses: ./.github/workflows/run-archive.yml
    with:
      mode: catchup
      source: andhra_goir
      from_date: ${{ inputs.from_date }}
      to_date: ${{ inputs.to_date }}
      run_time_mins: ${{ inputs.run_time_mins || '210' }}
    secrets: inherit

  telangana:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'telangana_goir')
    uses: ./.github/workflows/run-archive.yml
    with:
      mode: catchup
      source: telangana_goir
      from_date: ${{ github.event_name == 'schedule' && '17-04-2026' || inputs.from_date }}
      to_date: ${{ inputs.to_date }}
      run_time_mins: ${{ inputs.run_time_mins || '210' }}
    secrets: inherit

  uttarakhand:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'uttarakhand_gos')
    uses: ./.github/workflows/run-archive.yml
    with:
      mode: catchup
      source: uttarakhand_gos
      from_date: ${{ inputs.from_date }}
      to_date: ${{ inputs.to_date }}
      run_time_mins: ${{ inputs.run_time_mins || '210' }}
    secrets: inherit
