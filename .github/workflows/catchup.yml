name: Catch up government orders

on:
  schedule:
    - cron: '0 9 * * *' # 14:30 IST, after the daily archive's four-hour window.
  workflow_dispatch:
    inputs:
      source:
        description: Source to catch up
        type: choice
        options: [all, andhra_goir, telangana_goir, uttarakhand_gos]
        default: all
      from_date:
        description: Start date (DD-MM-YYYY); blank uses the source's earliest date
        type: string
        default: ''
      to_date:
        description: End date (DD-MM-YYYY); blank uses today
        type: string
        default: ''
      run_time_mins:
        description: Total catch-up work budget in minutes (1–210); job limit is 4 hours
        type: string
        default: '210'

permissions:
  contents: read

jobs:
  catchup:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-archive.yml
    with:
      mode: catchup
      source: ${{ github.event_name == 'schedule' && 'telangana_goir' || inputs.source }}
      from_date: ${{ github.event_name == 'schedule' && '17-04-2026' || inputs.from_date }}
      to_date: ${{ inputs.to_date }}
      run_time_mins: ${{ inputs.run_time_mins || '210' }}
    secrets: inherit
