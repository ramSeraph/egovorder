name: Run Andhra archive job

on:
  workflow_call:
    inputs:
      partition:
        description: all for historical gaps, latest for catch-up through today
        type: string
        required: true
      run_time_mins:
        type: string
        default: '210'
    secrets:
      IA_ACCESS_KEY:
        required: true
      IA_SECRET_KEY:
        required: true
      PROXY_IP_ADDRESS:
        required: true
      PROXY_AUTH:
        required: false

permissions:
  contents: read

jobs:
  archive:
    name: ${{ inputs.partition == 'latest' && 'Catch up Andhra to today' || 'Historical gaps' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      # Historical work is independent. Latest catch-up overlaps daily scraping.
      group: ${{ inputs.partition == 'latest' && 'goir-andhra_goir-false' || 'goir-audited-andhra-all-false' }}
      cancel-in-progress: false
    env:
      PARTITION: ${{ inputs.partition }}
      RUN_TIME_MINS: ${{ inputs.run_time_mins }}
    steps:
      - uses: actions/checkout@v4.1.7
        timeout-minutes: 2

      - uses: astral-sh/setup-uv@v5
        timeout-minutes: 3
        with:
          enable-cache: true
          cache-dependency-glob: 'requirements/*.txt'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          uv venv --python 3.12
          uv pip install -r requirements/iasync.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate plan and secrets
        timeout-minutes: 1
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PROXY_IP_ADDRESS: ${{ secrets.PROXY_IP_ADDRESS }}
        run: |
          python -m egovorder.backfill --validate --partition "$PARTITION"
          [[ -n "$IA_ACCESS_KEY" && -n "$IA_SECRET_KEY" ]] || { echo 'Set IA_ACCESS_KEY and IA_SECRET_KEY'; exit 1; }
          [[ -n "$PROXY_IP_ADDRESS" ]] || { echo 'Set PROXY_IP_ADDRESS to the Andhra proxy host'; exit 1; }

      - name: Restore unfinished uploads and progress
        id: restore
        timeout-minutes: 3
        uses: actions/cache/restore@v4
        with:
          path: data/backfill/${{ inputs.partition }}/
          key: egovorder-backfill-v1-${{ inputs.partition }}-${{ inputs.partition == 'latest' && 'latest' || hashFiles('plans/andhra-2026-10.csv') }}-false-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            egovorder-backfill-v1-${{ inputs.partition }}-${{ inputs.partition == 'latest' && 'latest' || hashFiles('plans/andhra-2026-10.csv') }}-false-

      - name: Download and upload orders
        timeout-minutes: 212
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PROXY_IP_ADDRESS: ${{ secrets.PROXY_IP_ADDRESS }}
          PROXY_AUTH: ${{ secrets.PROXY_AUTH }}
        run: python -m egovorder.backfill --upload --partition "$PARTITION"

      - name: Save unfinished uploads and progress
        if: always() && steps.restore.outcome == 'success'
        timeout-minutes: 4
        uses: actions/cache/save@v4
        with:
          path: data/backfill/${{ inputs.partition }}/
          key: egovorder-backfill-v1-${{ inputs.partition }}-${{ inputs.partition == 'latest' && 'latest' || hashFiles('plans/andhra-2026-10.csv') }}-false-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save progress report and recovery files
        if: always() && steps.restore.outcome == 'success'
        timeout-minutes: 4
        uses: actions/upload-artifact@v4
        with:
          name: andhra-backfill-${{ inputs.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/backfill/${{ inputs.partition }}/
          if-no-files-found: ignore
          retention-days: 90
