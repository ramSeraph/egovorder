# Adapted from egazette's GOIR workflows for egovorder.
# Shared job for daily downloads and historical catch-up runs; see LICENSE.

name: Run government-order archive job

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: recent
      source:
        type: string
        required: true
      from_date:
        type: string
        default: ''
      to_date:
        type: string
        default: ''
      last_n_days:
        type: string
        default: '180'
      run_time_mins:
        type: string
        default: '180'
    secrets:
      IA_ACCESS_KEY:
        required: true
      IA_SECRET_KEY:
        required: true
      PROXY_IP_ADDRESS:
        required: true
      PROXY_AUTH:
        required: false

permissions:
  contents: read

jobs:
  archive:
    name: ${{ inputs.mode }} — ${{ inputs.source }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: goir-${{ inputs.source }}-false
      cancel-in-progress: false
    env:
      SOURCE: ${{ inputs.source }}
      ARCHIVE_MODE: ${{ inputs.mode }}
      CACHE_PREFIX: ${{ inputs.mode == 'catchup' && 'egovorder-catchup-v1' || 'egovorder-data-v1' }}
      FROM_DATE: ${{ inputs.from_date }}
      TO_DATE: ${{ inputs.to_date }}
      LAST_N_DAYS: ${{ inputs.last_n_days }}
      RUN_TIME_MINS: ${{ inputs.run_time_mins }}
      TESTING_MODE: 'false'
    steps:
      - uses: actions/checkout@v4.1.7
        timeout-minutes: 2

      - uses: astral-sh/setup-uv@v5
        timeout-minutes: 3
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          uv sync --locked --extra archive
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate run settings
        timeout-minutes: 1
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PROXY_IP_ADDRESS: ${{ secrets.PROXY_IP_ADDRESS }}
        run: |
          case "$ARCHIVE_MODE" in
            recent) bash scripts/archive.sh --validate ;;
            catchup) python -m egovorder.catchup --validate ;;
            *) echo "Unknown archive mode"; exit 1 ;;
          esac
          [[ -n "$PROXY_IP_ADDRESS" ]] || { echo "Set PROXY_IP_ADDRESS"; exit 1; }

      - name: Restore unfinished downloads and progress
        id: restore
        timeout-minutes: 3
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: ${{ env.CACHE_PREFIX }}-${{ inputs.source }}-${{ env.TESTING_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ inputs.source }}-${{ env.TESTING_MODE }}-

      - name: Restore previous Andhra catch-up state for migration
        if: >-
          inputs.mode == 'catchup' && inputs.source == 'andhra_goir' && inputs.from_date == '' &&
          hashFiles('data/catchup/andhra_goir-production-latest.json') == ''
        timeout-minutes: 3
        uses: actions/cache/restore@v4
        with:
          path: data/backfill/latest/
          key: egovorder-backfill-v1-latest-latest-false-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            egovorder-backfill-v1-latest-latest-false-

      - name: Download and upload orders
        timeout-minutes: 212
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          PROXY_IP_ADDRESS: ${{ secrets.PROXY_IP_ADDRESS }}
          PROXY_AUTH: ${{ secrets.PROXY_AUTH }}
        run: |
          if [[ "$ARCHIVE_MODE" == 'catchup' ]]; then
            python -m egovorder.catchup
          else
            python -m egovorder.catchup --recent
          fi

      - name: Save unfinished downloads and progress
        timeout-minutes: 4
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/
          key: ${{ env.CACHE_PREFIX }}-${{ inputs.source }}-${{ env.TESTING_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
