name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies and package
        run: |
          uv venv --python 3.12
          uv pip install -r requirements/iasync.txt
          uv pip install --no-deps .
      - name: Check offline behavior
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/egovorder-sync --help
          .venv/bin/egovorder-iasync --help
