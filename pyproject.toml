[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egovorder"
version = "0.1.0"
description = "Andhra Pradesh and Telangana Government Order Issue Registry scrapers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "beautifulsoup4",
    "lxml",
    "python-magic",
    "requests",
]

[project.optional-dependencies]
archive = ["internetarchive", "pymupdf"]

[project.scripts]
egovorder-sync = "egovorder.sync:main"
egovorder-iasync = "egovorder.iasync:main"

[tool.setuptools.packages.find]
include = ["egovorder*"]
